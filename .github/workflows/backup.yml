# Nightly encrypted database backup (PRD §5).
# pg_dump (read-only role) → check it restores (table of contents) → age-encrypt
# with the public key → upload to the dommus-backups bucket (Neon branch
# "backups") and keep a 35-day copy as a workflow artifact. Daily copies are
# kept 35 days, month-end copies 7 years. Only the holder of the private key
# can read a backup; see docs/RESTORE.md.
name: Backup

on:
  schedule:
    - cron: "30 1 * * *" # 02:30 Lagos
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION }}
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
    steps:
      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Name today's backup (Lagos date)
        run: |
          echo "DAY=$(TZ=Africa/Lagos date +%F)" >> "$GITHUB_ENV"
          echo "MONTH=$(TZ=Africa/Lagos date +%Y-%m)" >> "$GITHUB_ENV"
          # Month-end: tomorrow in Lagos is the 1st.
          echo "MONTH_END=$([ "$(TZ=Africa/Lagos date -d tomorrow +%d)" = "01" ] && echo yes || echo no)" >> "$GITHUB_ENV"

      - name: Dump the database (PostgreSQL 17 client, read-only role)
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          mkdir -p out
          docker run --rm -e DATABASE_URL -v "$PWD/out:/out" postgres:17 \
            sh -c 'pg_dump --format=custom --compress=9 --file=/out/db.dump "$DATABASE_URL"'
          ls -l out/db.dump

      - name: Check the dump restores (table of contents)
        run: |
          docker run --rm -v "$PWD/out:/out" postgres:17 pg_restore --list /out/db.dump > out/toc.txt
          entries=$(grep -c ';' out/toc.txt)
          echo "TOC entries: $entries"
          for table in audit_log ledger_event evidence_file member setting; do
            grep -q "TABLE DATA [a-z]* $table " out/toc.txt || { echo "::error::$table missing from the dump"; exit 1; }
          done
          [ "$entries" -gt 50 ] || { echo "::error::dump looks too small"; exit 1; }

      - name: Encrypt with the public key and drop the plain copy
        env:
          RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          age --recipient "$RECIPIENT" --output "out/$DAY.dump.age" out/db.dump
          shred -u out/db.dump
          (cd out && sha256sum "$DAY.dump.age" > "$DAY.dump.age.sha256")
          ls -l out

      - name: Upload to the backup bucket
        run: |
          aws configure set default.s3.addressing_style path
          s3() { aws --endpoint-url "$ENDPOINT" s3 "$@"; }
          s3 cp "out/$DAY.dump.age" "s3://$BUCKET/daily/$DAY.dump.age" --only-show-errors
          s3 cp "out/$DAY.dump.age.sha256" "s3://$BUCKET/daily/$DAY.dump.age.sha256" --only-show-errors
          if [ "$MONTH_END" = "yes" ]; then
            s3 cp "out/$DAY.dump.age" "s3://$BUCKET/monthly/$MONTH.dump.age" --only-show-errors
            s3 cp "out/$DAY.dump.age.sha256" "s3://$BUCKET/monthly/$MONTH.dump.age.sha256" --only-show-errors
            echo "Month-end copy kept as monthly/$MONTH.dump.age"
          fi
          s3 ls "s3://$BUCKET/daily/$DAY.dump.age"

      - name: Delete daily copies older than 35 days
        run: |
          aws configure set default.s3.addressing_style path
          cutoff=$(TZ=Africa/Lagos date -d '35 days ago' +%F)
          aws --endpoint-url "$ENDPOINT" s3 ls "s3://$BUCKET/daily/" | awk '{print $4}' | while read -r key; do
            day=${key:0:10}
            if [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$day" < "$cutoff" ]]; then
              aws --endpoint-url "$ENDPOINT" s3 rm "s3://$BUCKET/daily/$key" --only-show-errors && echo "deleted daily/$key"
            fi
          done

      - name: Keep a second copy outside Neon (35 days)
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ env.DAY }}
          path: out/${{ env.DAY }}.dump.age*
          retention-days: 35
          if-no-files-found: error

      - name: Summary
        run: |
          {
            echo "### Backup $DAY"
            echo "- Encrypted dump: \`daily/$DAY.dump.age\` ($(stat -c %s "out/$DAY.dump.age") bytes)"
            echo "- SHA-256: \`$(cut -d' ' -f1 "out/$DAY.dump.age.sha256")\`"
            echo "- Month-end copy: $MONTH_END"
          } >> "$GITHUB_STEP_SUMMARY"
