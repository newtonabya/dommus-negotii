name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # The throwaway Neon `test` branch (repository secrets). Without them,
      # e.g. on pull requests from forks, the database tests are skipped.
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
      TEST_DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run lint
      - run: npx next typegen
      - run: npx tsc --noEmit
      - name: Apply migrations to the test branch
        if: env.TEST_DIRECT_URL != ''
        run: npx prisma migrate deploy
        env:
          DIRECT_URL: ${{ secrets.TEST_DIRECT_URL }}
      - run: npm test -- --ci
